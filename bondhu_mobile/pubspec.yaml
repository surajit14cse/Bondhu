name: bondhu_mobile
description: "Bondhu - Dating and Social Discovery App in Flutter"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Real-Time
  http: ^1.2.0
  socket_io_client: ^3.0.1

  # State Management
  provider: ^6.1.1

  # UI & Animations
  flutter_card_swiper: ^7.0.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0

  # Storage & Utilities
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
