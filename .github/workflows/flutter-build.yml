name: Build Flutter Android APK

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java / JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Reconstruct Android Wrapper & Platform scaffolding
        working-directory: bondhu_mobile
        run: |
          # Generate android wrapper & gradle files if missing
          flutter create --platforms=android --org com.bondhu .
          # Ensure compileSdk and targetSdk are 35 for modern Android plugins
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true

      - name: Install dependencies
        working-directory: bondhu_mobile
        run: flutter pub get

      - name: Build Android APK
        working-directory: bondhu_mobile
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bondhu-android-debug-apk
          path: bondhu_mobile/build/app/outputs/flutter-apk/app-debug.apk
